[project]
name = "budget-portal-inference"
version = "0.1.0"
description = "Open-model sidecar for the Data Explorer: typed decisions (LAYA) and embeddings (specs/020 B3)."
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "laya==0.4.31",
  "sentence-transformers>=3.3",
  "torch>=2.5",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
# Offline jobs (tools/laya, B5 topics) only; never in the serving image.
research = ["scikit-learn>=1.5", "bertopic>=0.16", "umap-learn>=0.5", "hdbscan>=0.8"]

[tool.uv]
package = false
