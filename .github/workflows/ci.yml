name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: pnpm lint
      - run: pnpm --filter api exec tsc --noEmit
      - run: pnpm --filter client exec tsc --noEmit
      - run: pnpm --filter api test
      - run: pnpm --filter client test
      - run: python3 -m unittest discover -s services/hearings  # standard library only
      - run: pnpm --filter api db:check:sample-city
      - run: pnpm build:api
      - run: pnpm build:client
