# Filled in by the nginx image when the container starts: ${SITE_HOST} comes from .env (docker-compose.yml).
server {
    listen 80;
    listen [::]:80;
    server_name ${SITE_HOST};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${SITE_HOST};

    ssl_certificate     /etc/letsencrypt/live/${SITE_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SITE_HOST}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # PPMP supporting documents: the API accepts 10 MB and the Next server action
    # 11 MB (client/next.config.ts). nginx's default is 1 MB, which 413s first.
    client_max_body_size 12m;

    # NestJS API. Scoped to the API's real global prefix — `api/src/main.ts`
    # calls setGlobalPrefix('api/v1') — and NOT to all of /api/. The Next client
    # serves its own same-origin route handlers under client/src/app/api/ (the
    # program fetch behind the edit page, the SSE proxy, the xlsx exports); a
    # broad `location /api/` hands every one of them to NestJS, which answers
    # `Cannot GET /api/...` and the UI renders a bare "Not Found".
    location /api/v1/ {
        proxy_pass         http://api:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Your own hearings data (docs/modules/hearings.md): the folder services/hearings writes, served as
    # files. Nothing is here until HEARINGS_DIR (docker-compose.yml) holds a pipeline's output; until
    # then every path under it answers 404. The pages live at /hearings, which this does not touch.
    # These files share the portal's origin and do not pass through the app, so they carry none of its
    # security headers: the ones below make anything opened from here inert (no script, no frame, no
    # type guessing). A location's add_header lines replace any set above it, so the list is whole.
    location /hearings-data/ {
        alias /srv/hearings/;
        add_header X-Robots-Tag "noindex" always;       # machine transcripts of named people
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Cache-Control "public, max-age=300";
    }

    # Next.js client
    location / {
        proxy_pass         http://client:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
